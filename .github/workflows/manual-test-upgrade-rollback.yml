name: Manual Test upgrade rehearsal with mandatory rollback
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        description: 'Legacy main or Telegram schema rehearsal; always rollback'
        options: [legacy, telegram]
        default: legacy
      confirm_test_ref:
        description: 'Test only; DDL is rolled back: beyrctbxojpuvhevfyok'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: waseet-test-upgrade-rollback
  cancel-in-progress: false
jobs:
  rehearse:
    if: github.ref == 'refs/heads/main' && inputs.scope != 'telegram'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/backup/requirements.txt
      - name: Verify reviewed DDL on Test, then roll back and compare catalog
        env:
          WASEET_TEST_DATABASE_URL: ${{ secrets.WASEET_TEST_DATABASE_URL }}
          CONFIRM_TEST_REF: ${{ inputs.confirm_test_ref }}
        run: python scripts/review/test_upgrade_rollback.py

  telegram:
    if: github.ref == 'refs/heads/feature/telegram-market-starter' && inputs.scope == 'telegram'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/backup/requirements.txt
      - name: Rehearse isolated Telegram schema on Test with mandatory rollback
        env:
          WASEET_TEST_DATABASE_URL: ${{ secrets.WASEET_TEST_DATABASE_URL }}
          CONFIRM_TEST_REF: ${{ inputs.confirm_test_ref }}
        run: python telegram-market/scripts/test_rehearsal.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telegram-test-rollback-${{ github.run_id }}
          path: telegram-test-rehearsal.json
          retention-days: 5
          if-no-files-found: error
