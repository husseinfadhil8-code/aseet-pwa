name: Telegram market checks and isolated Worker deployment
on:
  pull_request:
    paths: ['telegram-market/**', '.github/workflows/telegram-market.yml']
  push:
    branches: [feature/telegram-market-starter, feature/telegram-wanted-radar, feature/telegram-intelligent-guide]
    paths: ['telegram-market/**', '.github/workflows/telegram-market.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: telegram-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm --prefix telegram-market ci --ignore-scripts
      - run: npm --prefix telegram-market test
      - run: npm --prefix telegram-market run dry-run
      - name: Pull isolated PostgreSQL
        timeout-minutes: 2
        run: docker pull postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
      - run: npm --prefix telegram-market run test:platform
      - run: npm --prefix telegram-market run test:cash
      - run: npm --prefix telegram-market run test:notification-center
      - run: npm --prefix telegram-market run test:outbox
      - run: python telegram-market/tests/schema-contracts.py
      - run: pip install playwright==1.56.0
      - name: Official Ubuntu HTTPS package mirrors
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          if [ -f /etc/apt/apt-mirrors-security.txt ]; then
            printf '%s\n' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null
          fi
      - run: python -m playwright install-deps chromium webkit
        timeout-minutes: 3
      - run: python -m playwright install chromium webkit
        timeout-minutes: 3
      - run: python telegram-market/tests/browser.py
      - run: WASEET_BROWSER=webkit python telegram-market/tests/browser.py
      - run: python telegram-market/tests/wanted_browser.py
      - run: WASEET_BROWSER=webkit python telegram-market/tests/wanted_browser.py
      - run: python telegram-market/tests/intelligence_browser.py
      - run: WASEET_BROWSER=webkit python telegram-market/tests/intelligence_browser.py
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/telegram-market-starter'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - id: credentials
        name: Check deploy authorization without displaying credentials
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Worker not deployed: Cloudflare credentials are not configured for Actions.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - id: schema
        name: Require verified matching Test schema before automatic deployment
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {validSchemaProof,validNotificationProof,validWantedProof,validIntelligenceProof} from './telegram-market/scripts/cloudflare_build_gate.mjs';
          let ready=false;
          try {
            const digest=createHash('sha256').update(fs.readFileSync('telegram-market/db/003_admin_settings.sql')).digest('hex');
            const notificationDigest=createHash('sha256').update(fs.readFileSync('telegram-market/db/004_notifications.sql')).digest('hex');
            const wantedDigest=createHash('sha256').update(fs.readFileSync('telegram-market/db/005_wanted_radar.sql')).digest('hex');
            const intelligenceDigest=createHash('sha256').update(fs.readFileSync('telegram-market/db/006_guide_assistant.sql')).digest('hex');
            ready=validIntelligenceProof(JSON.parse(fs.readFileSync('telegram-market/evidence/phase6-install.json','utf8')),intelligenceDigest) && validWantedProof(JSON.parse(fs.readFileSync('telegram-market/evidence/phase5-install.json','utf8')),wantedDigest) && validSchemaProof(JSON.parse(fs.readFileSync('telegram-market/evidence/phase3-install.json','utf8')),digest) && validNotificationProof(JSON.parse(fs.readFileSync('telegram-market/evidence/phase4-install.json','utf8')),notificationDigest);
          } catch {}
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'ready='+ready+'\n');
          if(!ready) console.log('Automatic deployment skipped: matching verified Test schema proof is required.');
          JS
      - if: steps.credentials.outputs.ready == 'true' && steps.schema.outputs.ready == 'true'
        run: npm --prefix telegram-market ci --ignore-scripts
      - if: steps.credentials.outputs.ready == 'true' && steps.schema.outputs.ready == 'true'
        run: npm --prefix telegram-market run deploy
      - if: steps.credentials.outputs.ready == 'true' && steps.schema.outputs.ready == 'true'
        run: python telegram-market/scripts/configure_cloudflare.py
