name: Manual Test checks and isolated Telegram provisioning
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        description: 'Legacy/Telegram rollback rehearsal, or install verified Telegram namespace on Test'
        options: [user-notifications-rehearsal, user-notifications-apply, user-notifications-verify, outbox-archive, outbox-recovery, outbox-verify, outbox-rehearsal, outbox-migrate, legacy, telegram, telegram-install-test, telegram-phase2-rollback, telegram-phase2-install, telegram-phase3-rollback, telegram-phase3-install, telegram-phase4-rollback, telegram-phase4-install, telegram-phase5-rollback, telegram-phase5-install, telegram-phase6-rollback, telegram-phase6-install]
        default: legacy
      confirm_test_ref:
        description: 'Test only; rehearsal or verified install: beyrctbxojpuvhevfyok'
        type: string
        required: true
      rehearsal_run_id:
        description: 'Successful same-SQL user-notification rehearsal run ID; apply only'
        type: string
        required: false
        default: ''
      writers_paused:
        description: 'Apply only: live Worker writer gate paused and writer leases drained'
        type: boolean
        default: false
      worker_binding_verified:
        description: 'Apply only: deployed waseet-telegram-bot verified using the confirmed live Supabase project'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: waseet-test-upgrade-rollback
  cancel-in-progress: false
jobs:
  production-user-notifications:
    if: github.ref == 'refs/heads/feature/user-notifications' && startsWith(inputs.scope, 'user-notifications-')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      CLIENT_IMAGE: postgres@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
      RESTORE_IMAGE: supabase/postgres@sha256:1a0d4be3de6753435f7b609fd3edccdbff85842e7b73391f8c6d285d0a8ccd9f
      CONFIRM_TEST_REF: ${{ inputs.confirm_test_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned database tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/backup/requirements.txt
          command -v gpg
          docker info > /dev/null
      - name: Require concrete production preconditions before an apply
        if: inputs.scope == 'user-notifications-apply'
        env:
          PAUSED: ${{ inputs.writers_paused }}
          BINDING: ${{ inputs.worker_binding_verified }}
          REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id }}
        run: |
          python - <<'PY'
          import os
          assert os.environ['PAUSED']=='true' and os.environ['BINDING']=='true', 'Verify live binding, pause and drained writer leases before applying'
          assert os.environ['REHEARSAL_RUN_ID'].isdecimal(), 'Successful exact-SQL rehearsal run ID required'
          PY
      - name: Retrieve successful exact-SQL rehearsal proof
        if: inputs.scope == 'user-notifications-apply'
        env:
          GH_TOKEN: ${{ github.token }}
          REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/user-rehearsal"
          gh run download "$REHEARSAL_RUN_ID" --repo husseinfadhil8-code/aseet-pwa --name "user-notifications-proof-$REHEARSAL_RUN_ID" --dir "$RUNNER_TEMP/user-rehearsal" > "$RUNNER_TEMP/rehearsal-download.log" 2>&1
      - name: Pull pinned restore images
        if: inputs.scope != 'user-notifications-verify'
        run: |
          docker pull "$CLIENT_IMAGE" > /dev/null
          docker pull "$RESTORE_IMAGE" > /dev/null
      - name: Fresh encrypted PostgreSQL backup and complete isolated restore
        if: inputs.scope != 'user-notifications-verify'
        env:
          WASEET_TEST_DATABASE_URL: ${{ secrets.WASEET_TEST_DATABASE_URL }}
          WASEET_BACKUP_PASSPHRASE: ${{ secrets.WASEET_BACKUP_PASSPHRASE }}
          WASEET_TEST_RESTORE_IMAGE: ${{ env.RESTORE_IMAGE }}
        run: python telegram-market/scripts/user_notifications_release.py backup --backup "$RUNNER_TEMP/user-pre-release-backup"
      - name: Retain verified recovery ciphertext before any migration
        if: inputs.scope != 'user-notifications-verify'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: user-notifications-encrypted-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/user-pre-release-backup/Waseet-Test.postgres.tar.gpg
            ${{ runner.temp }}/user-pre-release-backup/SHA256SUMS
            ${{ runner.temp }}/user-pre-release-backup/verification.json
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
      - name: Rehearse with rollback, apply incrementally, or verify production
        env:
          GH_TOKEN: ${{ github.token }}
          WASEET_TEST_DATABASE_URL: ${{ secrets.WASEET_TEST_DATABASE_URL }}
          WRITERS_PAUSED_CONFIRMED: ${{ inputs.writers_paused }}
          WORKER_PROJECT_VERIFIED: ${{ inputs.worker_binding_verified }}
          RELEASE_MODE: ${{ inputs.scope == 'user-notifications-apply' && 'apply' || inputs.scope == 'user-notifications-verify' && 'verify' || 'rehearsal' }}
        run: python telegram-market/scripts/user_notifications_release.py "$RELEASE_MODE" --backup "$RUNNER_TEMP/user-pre-release-backup" --rehearsal "$RUNNER_TEMP/user-rehearsal/user-notifications-proof.json"
      - name: Upload safe schema and preservation proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: user-notifications-proof-${{ github.run_id }}
          path: user-notifications-proof.json
          if-no-files-found: error
          retention-days: 30
      - name: Always remove private plaintext and isolated containers
        if: always()
        run: |
          docker ps -aq --filter label=dev.waseet.manual-backup | xargs -r docker rm -fv > /dev/null 2>&1 || true
          python - <<'PY'
          import glob,os,shutil
          for path in glob.glob('/tmp/waseet-backup-user-release-*'):
              shutil.rmtree(path,ignore_errors=True)
          for name in ('user-pre-release-backup','user-rehearsal'):
              shutil.rmtree(os.path.join(os.environ['RUNNER_TEMP'],name),ignore_errors=True)
          PY

  rehearse:
    if: github.ref == 'refs/heads/main' && (inputs.scope == 'legacy' || inputs.scope == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/backup/requirements.txt
      - name: Verify reviewed DDL on Test, then roll back and compare catalog
        env:
          WASEET_TEST_DATABASE_URL: ${{ secrets.WASEET_TEST_DATABASE_URL }}
          CONFIRM_TEST_REF: ${{ inputs.confirm_test_ref }}
        run: python scripts/review/test_upgrade_rollback.py

  telegram:
    if: github.ref == 'refs/heads/feature/telegram-market-starter' && inputs.scope == 'telegram'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/backup/requirements.txt
      - name: Rehearse isolated Telegram schema on Test with mandatory rollback
        env:
          WASEET_TEST_DATABASE_URL: ${{ secrets.WASEET_TEST_DATABASE_URL }}
          CONFIRM_TEST_REF: ${{ inputs.confirm_test_ref }}
        run: python telegram-market/scripts/test_rehearsal.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telegram-test-rollback-${{ github.run_id }}
          path: telegram-test-rehearsal.json
          retention-days: 5
          if-no-files-found: error

  telegram-install-test:
    if: github.ref == 'refs/heads/feature/telegram-market-starter' && inputs.scope == 'telegram-install-test'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/backup/requirements.txt
      - name: Install verified isolated namespace on Waseet-Test only
        env:
          WASEET_TEST_DATABASE_URL: ${{ secrets.WASEET_TEST_DATABASE_URL }}
          CONFIRM_TEST_REF: ${{ inputs.confirm_test_ref }}
          TELEGRAM_TEST_INSTALL: 'true'
        run: python telegram-market/scripts/test_rehearsal.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telegram-test-provision-${{ github.run_id }}
          path: telegram-test-rehearsal.json
          retention-days: 5
          if-no-files-found: error

  telegram-phase2:
    if: (github.ref == 'refs/heads/feature/telegram-rep-onboarding' || github.ref == 'refs/heads/feature/telegram-market-starter') && (inputs.scope == 'telegram-phase2-rollback' || inputs.scope == 'telegram-phase2-install')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/backup/requirements.txt
      - name: Verify pinned incremental SQL on confirmed Test
        env:
          WASEET_TEST_DATABASE_URL: ${{ secrets.WASEET_TEST_DATABASE_URL }}
          CONFIRM_TEST_REF: ${{ inputs.confirm_test_ref }}
          TELEGRAM_PHASE2_INSTALL: ${{ inputs.scope == 'telegram-phase2-install' && 'true' || 'false' }}
        run: python telegram-market/scripts/phase2_test.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telegram-phase2-${{ github.run_id }}
          path: telegram-phase2-proof.json
          retention-days: 5
          if-no-files-found: error

  telegram-phase3:
    if: (github.ref == 'refs/heads/feature/telegram-rep-onboarding' || github.ref == 'refs/heads/feature/telegram-market-starter') && (inputs.scope == 'telegram-phase3-rollback' || inputs.scope == 'telegram-phase3-install')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/backup/requirements.txt
      - name: Verify pinned incremental SQL on confirmed Test
        env:
          WASEET_TEST_DATABASE_URL: ${{ secrets.WASEET_TEST_DATABASE_URL }}
          CONFIRM_TEST_REF: ${{ inputs.confirm_test_ref }}
          TELEGRAM_PHASE3_INSTALL: ${{ inputs.scope == 'telegram-phase3-install' && 'true' || 'false' }}
        run: python telegram-market/scripts/phase3_test.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telegram-phase3-${{ github.run_id }}
          path: telegram-phase3-proof.json
          retention-days: 5
          if-no-files-found: error

  telegram-phase4:
    if: (github.ref == 'refs/heads/feature/telegram-rep-onboarding' || github.ref == 'refs/heads/feature/telegram-market-starter') && (inputs.scope == 'telegram-phase4-rollback' || inputs.scope == 'telegram-phase4-install')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/backup/requirements.txt
      - name: Verify pinned incremental SQL on confirmed Test
        env:
          WASEET_TEST_DATABASE_URL: ${{ secrets.WASEET_TEST_DATABASE_URL }}
          CONFIRM_TEST_REF: ${{ inputs.confirm_test_ref }}
          TELEGRAM_PHASE4_INSTALL: ${{ inputs.scope == 'telegram-phase4-install' && 'true' || 'false' }}
        run: python telegram-market/scripts/phase4_test.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telegram-phase4-${{ github.run_id }}
          path: telegram-phase4-proof.json
          retention-days: 5
          if-no-files-found: error

  telegram-phase5:
    if: github.ref == 'refs/heads/feature/telegram-wanted-radar' && (inputs.scope == 'telegram-phase5-rollback' || inputs.scope == 'telegram-phase5-install')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/backup/requirements.txt
      - name: Verify pinned incremental SQL on confirmed Test
        env:
          WASEET_TEST_DATABASE_URL: ${{ secrets.WASEET_TEST_DATABASE_URL }}
          CONFIRM_TEST_REF: ${{ inputs.confirm_test_ref }}
          TELEGRAM_PHASE5_INSTALL: ${{ inputs.scope == 'telegram-phase5-install' && 'true' || 'false' }}
        run: python telegram-market/scripts/phase5_test.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telegram-phase5-${{ github.run_id }}
          path: telegram-phase5-proof.json
          retention-days: 5
          if-no-files-found: error

  telegram-phase6:
    if: github.ref == 'refs/heads/feature/telegram-intelligent-guide' && (inputs.scope == 'telegram-phase6-rollback' || inputs.scope == 'telegram-phase6-install')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/backup/requirements.txt
      - name: Verify pinned incremental SQL on confirmed Test
        env:
          WASEET_TEST_DATABASE_URL: ${{ secrets.WASEET_TEST_DATABASE_URL }}
          CONFIRM_TEST_REF: ${{ inputs.confirm_test_ref }}
          TELEGRAM_PHASE6_INSTALL: ${{ inputs.scope == 'telegram-phase6-install' && 'true' || 'false' }}
        run: python telegram-market/scripts/phase6_test.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telegram-phase6-${{ github.run_id }}
          path: telegram-phase6-proof.json
          retention-days: 5
          if-no-files-found: error

  production-outbox:
    if: github.ref == 'refs/heads/fix/transactional-notification-outbox' && (inputs.scope == 'outbox-rehearsal' || inputs.scope == 'outbox-migrate' || inputs.scope == 'outbox-verify' || inputs.scope == 'outbox-recovery')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/backup/requirements.txt
      - name: Verify restored backup and rehearse or migrate exact production target
        if: inputs.scope != 'outbox-verify' && inputs.scope != 'outbox-recovery'
        env:
          GH_TOKEN: ${{ github.token }}
          WASEET_TEST_DATABASE_URL: ${{ secrets.WASEET_TEST_DATABASE_URL }}
          CONFIRM_TEST_REF: ${{ inputs.confirm_test_ref }}
          OUTBOX_MODE: ${{ inputs.scope == 'outbox-migrate' && 'migrate' || 'rehearsal' }}
        run: python telegram-market/scripts/outbox_migrate.py
      - name: Verify live capture using isolated temporary fixtures
        if: inputs.scope == 'outbox-verify' || inputs.scope == 'outbox-recovery'
        env:
          WASEET_TEST_DATABASE_URL: ${{ secrets.WASEET_TEST_DATABASE_URL }}
          CONFIRM_TEST_REF: ${{ inputs.confirm_test_ref }}
          OUTBOX_RECOVERY: ${{ inputs.scope == 'outbox-recovery' && 'true' || 'false' }}
        run: python telegram-market/scripts/outbox_verify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: outbox-proof-${{ github.run_id }}
          path: outbox-proof.json
          if-no-files-found: error

  retain-pre-migration-backup:
    if: github.ref == 'refs/heads/fix/transactional-notification-outbox' && inputs.scope == 'outbox-archive'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download verified ciphertext without exposing credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/pre-outbox-backup"
          gh run download 40835422435 --repo husseinfadhil8-code/aseet-pwa --name Waseet-Test-encrypted-40835422435-1 --dir "$RUNNER_TEMP/pre-outbox-backup" > "$RUNNER_TEMP/backup-download.log" 2>&1
          python - <<'PYTHON'
          import os,pathlib,hashlib,json
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'pre-outbox-backup'
          for line in (p/'SHA256SUMS').read_text().splitlines():
              digest,name=line.split(maxsplit=1)
              assert hashlib.sha256((p/name.lstrip('*')).read_bytes()).hexdigest()==digest
          v=json.loads((p/'verification.json').read_text())
          assert v['project_ref']=='beyrctbxojpuvhevfyok' and v['isolated_postgres_restore_verified']
          print('Verified encrypted pre-migration backup retained without decryption')
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-pre-outbox-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/pre-outbox-backup/
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
