<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وسيط - منصة البيع بالعمولة</title>

  <!-- الخطوط وتصميم الواجهة (Navy & Gold) -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0B192C;
      --navy-light: #1E3E62;
      --gold: #F1C40F;
      --gold-light: #FFE797;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --green: #10B981;
      --green-bg: #D1FAE5;
      --orange: #F59E0B;
      --orange-bg: #FEF3C7;
      --red: #EF4444;
      --blue: #3B82F6;
      --blue-bg: #DBEAFE;
      --purple: #8B5CF6;
      --purple-bg: #EDE9FE;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 920px;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    @media (min-width: 481px) {
      .app-container {
        border-radius: 24px;
        border: 8px solid var(--navy);
      }
    }

    .header {
      background: var(--navy);
      color: #fff;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid var(--gold);
    }

    .header-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--gold);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      background: var(--gold);
      color: var(--navy);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 90px;
    }

    .hidden {
      display: none !important;
    }

    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--navy);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 2px solid var(--gold);
      z-index: 10;
    }

    .nav-item {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      flex: 1;
    }

    .nav-item span {
      font-size: 18px;
      margin-bottom: 2px;
    }

    .nav-item.active {
      color: var(--gold);
    }

      background: var(--navy);
      color: var(--gold);
      border: none;
