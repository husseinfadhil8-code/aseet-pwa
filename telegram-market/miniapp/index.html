<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e2337"><title>وسيط | سوق تلغرام</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#13283a;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:linear-gradient(140deg,#09223a,#174b5a);color:white;padding:24px 16px 20px;border-radius:0 0 26px 26px}.wrap{max-width:660px;margin:auto}.brand{display:flex;justify-content:space-between;align-items:center}.brand b{font-size:25px}.tag{font-size:12px;color:#d5e5e6}.search{margin-top:18px;width:100%;border:0;border-radius:14px;padding:14px;outline:0}main{padding:14px 14px 95px}h2{font-size:18px;margin:20px 2px 12px}.chips{display:flex;gap:8px;overflow:auto;padding:4px 0}.chip{background:white;border:1px solid #dde4ec;padding:9px 14px;border-radius:50px;white-space:nowrap}.chip.active{background:#0d354c;color:white;border-color:#0d354c}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{background:white;border-radius:18px;overflow:hidden;border:1px solid #e5eaf0}.pic{height:130px;display:grid;place-items:center;font-size:55px;background:linear-gradient(135deg,#e7f2f4,#f8f4e6)}.details{padding:11px}.details b{font-size:14px;display:block}.price{color:#087c74;font-weight:800;margin:6px 0}.muted{color:#6a7783;font-size:12px}.promoted{display:inline-block;font-size:11px;color:#835600;background:#ffefbd;border-radius:30px;padding:3px 8px;margin-bottom:6px}.bottom{position:fixed;bottom:0;right:0;left:0;display:flex;justify-content:space-around;background:white;border-top:1px solid #e5eaf0;padding:12px 5px max(12px,env(safe-area-inset-bottom));box-shadow:0 -4px 25px #0a223412}.bottom button{background:none;border:0;color:#42566a;font-size:12px}.bottom .on{color:#008979;font-weight:800}.sheet{position:fixed;inset:0;background:#0008;display:none;align-items:end;z-index:20}.sheet.open{display:flex}.panel{background:white;width:100%;max-width:660px;margin:auto;border-radius:22px 22px 0 0;padding:20px 16px 28px;max-height:90vh;overflow:auto}.panel label{display:block;font-size:13px;margin-top:12px}.panel input,.panel select,.panel textarea{width:100%;padding:12px;border:1px solid #d6dfe6;border-radius:12px;margin-top:5px}.primary{border:0;border-radius:12px;background:#0b766d;color:white;padding:13px;width:100%;margin-top:15px;font-weight:700}.close{float:left;border:0;background:#edf2f5;border-radius:10px;padding:8px 12px}.empty{color:#617180;padding:20px;background:white;border-radius:14px}.note{font-size:12px;color:#68808d;margin-top:12px}</style></head>
<body><div class="wrap"><header><div class="brand"><div><b>🛍 وسيط</b><div class="tag">من الناس إلى الناس • سوق داخل تلغرام</div></div><span>🇮🇶 العراق</span></div><input class="search" id="search" placeholder="🔎 ابحث عن سيارة، عقار، أثاث..." aria-label="البحث في الإعلانات"></header>
<main><h2>تصفح الأقسام</h2><div id="categories" class="chips"></div><h2>✨ إعلانات السوق <span class="muted" id="count"></span></h2><div id="products" class="grid"></div><p class="note">نسخة تجريبية للواجهة. الإعلانات المضافة تُحفظ على جهازك فقط حالياً، وليست منشورة للآخرين.</p></main>
<nav class="bottom"><button class="on" id="home">⌂<br>الرئيسية</button><button id="add">＋<br>إضافة إعلان</button><button id="fav">♡<br>المفضلة</button><button id="account">☻<br>حسابي</button></nav></div>
<div class="sheet" id="sheet"><div class="panel"><button class="close" id="close">إغلاق ×</button><h2>انشر إعلانك مجاناً</h2><form id="form"><label>عنوان الإعلان<input name="title" required maxlength="70" placeholder="مثلاً: تخم 8 مقاعد بحالة ممتازة"></label><label>السعر بالدينار العراقي<input name="price" type="number" min="0" required></label><label>المحافظة أو المنطقة<input name="area" required maxlength="60" placeholder="بغداد - الزعفرانية"></label><label>الصنف<select name="category"><option>أثاث</option><option>سيارات</option><option>عقارات</option><option>إلكترونيات</option><option>أخرى</option></select></label><label>تفاصيل الإعلان<textarea name="description" maxlength="800" rows="3"></textarea></label><button class="primary" type="submit">حفظ الإعلان التجريبي</button></form></div></div>
<script>
const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand()}catch{}
const initial=[{id:1,title:"تخم 8 مقاعد",price:130000,area:"بغداد - الشعلة",category:"أثاث",emoji:"🛋️",featured:true},{id:2,title:"قطعة أرض 100 متر",price:35000000,area:"بغداد - حي التراث",category:"عقارات",emoji:"🏡",featured:true},{id:3,title:"موبايل بحالة جيدة",price:290000,area:"بغداد",category:"إلكترونيات",emoji:"📱"},{id:4,title:"سيارة للبيع",price:14000000,area:"بغداد",category:"سيارات",emoji:"🚙"}];
let saved=[];try{saved=JSON.parse(localStorage.getItem("waseet_telegram_demo")||"[]");if(!Array.isArray(saved))saved=[]}catch{}
let active="الكل";const cats=["الكل","سيارات","عقارات","أثاث","إلكترونيات","أخرى"];const $=id=>document.getElementById(id);
function render(){const term=$("search").value.trim().toLocaleLowerCase("ar");$("categories").replaceChildren(...cats.map(c=>{const b=document.createElement("button");b.className="chip"+(active===c?" active":"");b.textContent=c;b.onclick=()=>{active=c;render()};return b}));const data=[...saved,...initial].filter(p=>(active==="الكل"||p.category===active)&&[p.title,p.area,p.category].join(" ").toLocaleLowerCase("ar").includes(term));$("count").textContent="("+data.length+")";$("products").replaceChildren(...data.map(p=>{const card=document.createElement("article");card.className="product";const pic=document.createElement("div");pic.className="pic";pic.textContent=p.emoji||"📦";const d=document.createElement("div");d.className="details";if(p.featured){const badge=document.createElement("span");badge.className="promoted";badge.textContent="مميز";d.append(badge)}const name=document.createElement("b");name.textContent=p.title;const price=document.createElement("div");price.className="price";price.textContent=Number(p.price).toLocaleString("ar-IQ")+" د.ع";const area=document.createElement("div");area.className="muted";area.textContent="📍 "+p.area;d.append(name,price,area);card.append(pic,d);return card}));if(!data.length){const empty=document.createElement("p");empty.className="empty";empty.textContent="ماكو إعلانات مطابقة للبحث";$("products").append(empty)}}
$("search").oninput=render;$("add").onclick=()=>$("sheet").classList.add("open");$("close").onclick=()=>$("sheet").classList.remove("open");$("sheet").onclick=e=>{if(e.target===$("sheet"))$("sheet").classList.remove("open")};$("home").onclick=()=>{active="الكل";$("search").value="";render();window.scrollTo(0,0)};$("fav").onclick=()=>alert("المفضلة راح تتفعل بمرحلة ربط الحسابات");$("account").onclick=()=>alert("راح نربط الحساب الآمن بهوية تلغرام بالمرحلة الجاية");
$("form").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const item={id:Date.now(),title:String(f.get("title")),price:Number(f.get("price")),area:String(f.get("area")),category:String(f.get("category")),description:String(f.get("description")),emoji:{"أثاث":"🛋️","سيارات":"🚙","عقارات":"🏡","إلكترونيات":"📱"}[String(f.get("category"))]||"📦"};saved.unshift(item);try{localStorage.setItem("waseet_telegram_demo",JSON.stringify(saved))}catch{}active="الكل";$("search").value="";render();e.target.reset();$("sheet").classList.remove("open");alert("انحفظ الإعلان بهالجهاز للتجربة فقط — بعده مو منشور للناس")};render();
</script></body></html>
