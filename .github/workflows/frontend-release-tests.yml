name: Official frontend compatibility
on:
  pull_request:
  push:
    branches: [main, feature/comprehensive-mobile-review]
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          pip install --require-hashes --only-binary=:all: -r scripts/backup/requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check notification context with isolated service mocks
        run: npx --yes --package=deno@2.5.6 deno test --import-map scripts/push_context/import-map.json scripts/push_context/context_test.ts
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium webkit
      - run: python scripts/browser_app_security.py -v
      - run: python scripts/browser_comprehensive.py -v
      - run: WASEET_BROWSER=webkit python scripts/browser_comprehensive.py -v
      - run: python scripts/browser_release.py -v
      - run: WASEET_BROWSER=webkit python scripts/browser_release.py -v
      - run: python scripts/browser_batch.py -v
      - run: WASEET_BROWSER=webkit python scripts/browser_batch.py -v
      - run: python scripts/browser_goods_paging.py -v
      - run: WASEET_BROWSER=webkit python scripts/browser_goods_paging.py -v
      - run: python scripts/browser_reports.py -v
      - run: WASEET_BROWSER=webkit python scripts/browser_reports.py -v
      - name: Capture reviewed interfaces with synthetic data only
        run: |
          git worktree add --detach "$RUNNER_TEMP/waseet-before-review" be41330087556a2b4601c68da017d50f1b76e554
          python scripts/capture_review.py --root "$RUNNER_TEMP/waseet-before-review" --output "$RUNNER_TEMP/waseet-review-images/before"
          python scripts/capture_review.py --output "$RUNNER_TEMP/waseet-review-images/after"
      - name: Save synthetic interface screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: waseet-interface-review-${{ github.run_id }}
          path: ${{ runner.temp }}/waseet-review-images
          retention-days: 5
          if-no-files-found: error
