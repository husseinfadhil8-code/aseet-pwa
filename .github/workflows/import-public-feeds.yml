name: Waseet free public-feed importer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-public-feeds.yml'
      - 'scripts/**'
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  import-public-feeds:
    # Release is frontend-only: no automated production imports.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Test importer parsers offline
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Import permitted RSS/Atom listings
        env:
          SUPABASE_URL: https://auqxdtbvfonzrlilygjg.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FREE_RSS_FEEDS: ${{ vars.FREE_RSS_FEEDS }}
          MAX_ITEMS_PER_FEED: "30"
        run: python3 scripts/import_public_feeds.py
