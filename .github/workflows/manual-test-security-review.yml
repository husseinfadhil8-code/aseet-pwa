name: Manual read-only Test security review
on:
  workflow_dispatch:
    inputs:
      confirm_test_ref:
        description: 'Confirm Waseet-Test: beyrctbxojpuvhevfyok'
        required: true
        type: string
permissions:
  contents: read
jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install hash-pinned adapter
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/backup/requirements.txt
      - name: Review Test metadata only; never migrate or export user rows
        env:
          WASEET_TEST_DATABASE_URL: ${{ secrets.WASEET_TEST_DATABASE_URL }}
          CONFIRM_TEST_REF: ${{ inputs.confirm_test_ref }}
        run: python scripts/review/test_security_metadata.py
