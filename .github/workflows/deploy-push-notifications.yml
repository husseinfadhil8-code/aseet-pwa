name: Deploy push notifications

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/push-notifications/**"
      - ".github/workflows/deploy-push-notifications.yml"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Supabase Edge Function
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify deployment secret exists
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN in GitHub repository Actions secrets."
            exit 1
          fi

      - name: Deploy push-notifications function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy push-notifications --project-ref auqxdtbvfonzrlilygjg
