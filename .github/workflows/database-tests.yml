name: Local database migrations and RLS tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker pull postgres:17
      - run: python3 scripts/install_supabase_cli.py
      - run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/integration_migrations.py -v
      - run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/integration_rls_privileges.py -v
      - run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/integration_waseet_test.py -v
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: pip install playwright==1.56.0
      - run: python3 -m playwright install --with-deps chromium webkit
      - run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/browser_app_security.py -v
      - run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/browser_marketplace.py -v
      - run: WASEET_BROWSER=webkit PYTHONDONTWRITEBYTECODE=1 python3 scripts/browser_marketplace.py -v
